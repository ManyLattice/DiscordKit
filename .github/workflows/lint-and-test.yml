name: Lint and Test

on:
  push:
    branches: [ main, bunker-bot ] # Running on every branch causes double runs for PR commits
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift Build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}

      - name: Cache libdave
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/DiscordKit-libdave
            Vendor/CDave.xcframework
          key: libdave-${{ runner.os }}-${{ hashFiles('scripts/build-libdave.sh') }}

      - name: Build libdave
        run: test -d Vendor/CDave.xcframework || scripts/build-libdave.sh

      - name: Build
        run: swift build

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Test
        run: swift test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
